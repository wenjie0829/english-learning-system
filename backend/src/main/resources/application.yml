server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  application:
    name: english-learning-system
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-environment-at-least-256-bits}
  expiration: 86400000

ai:
  api-key: ${DEEPSEEK_API_KEY:sk-b17ae189a7474e50b645addf3b0fc853}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: ${AI_MODEL:deepseek-v4-flash}

file:
  upload-dir: /app/uploads
  audio-dir: /app/uploads/audio
  image-dir: /app/uploads/images

logging:
  level:
    com.englishlearning.app: DEBUG
    org.springframework.security: DEBUG