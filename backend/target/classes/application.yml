server:
  port: 8080
  servlet:
    context-path: /api
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  application:
    name: english-learning-system
  
  datasource:
    url: jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# JWT Configuration
jwt:
  secret: your-secret-key-change-this-in-production-environment-at-least-256-bits
  expiration: 86400000 # 24 hours in milliseconds

# AI Configuration (OpenAI or other AI service)
ai:
  api-key: sk-b17ae189a7474e50b645addf3b0fc853
  api-url: https://api.openai.com/v1/chat/completions
  model: deepseek-v4-flash

# File Upload Configuration
file:
  upload-dir: ./uploads
  audio-dir: ./uploads/audio
  image-dir: ./uploads/images

# Logging
logging:
  level:
    com.englishlearning.app: DEBUG
    org.springframework.security: DEBUG
